spring.application.name=demo

# URL de conexión a la base de datos local (puerto por defecto 3306)
spring.datasource.url=jdbc:mysql://localhost:3306/techstore

# Tu usuario de MySQL (por defecto suele ser root)
spring.datasource.username=root

# Esta es mi contraseña de MySQL, pero al usar xampp puede ir vacia
spring.datasource.password=

# Con esto Hibernate crea las tablas automaticamente
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola de Spring las sentencias SQL que se ejecutan por detrás
spring.jpa.show-sql=true